[project]
name = "palpate"
version = "0.1.0"
description = "Exam study agent that finds the source behind every answer."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "jieba>=0.42",
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["pymupdf.*", "jieba.*", "boto3.*", "psycopg.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pymupdf ships partial type hints; allow calling its untyped constructors here.
module = ["app.ingestion.parser"]
disallow_untyped_calls = false
